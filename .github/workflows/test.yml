name: "Test"

on:
  push:
    branches:
      - main
      - v1
  pull_request:
    branches:
      - main
      - v1
    types: [ opened ]

  workflow_call: 
    
jobs:
  test:
    runs-on: ubuntu-latest
    container: astral/uv:python3.12-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Dependency
        run: uv sync
      # - name: Install Playwright Browsers
      #   run: uv run playwright install --with-deps
      - name: Install Playwright Browsers
        run: uv run --with playwright playwright install --with-deps
      # - name: Test
      #   run: uv run pytest tests/
      - name: Test
        run: uv run --with pytest-playwright pytest tests/
